services:
  corpus-prepare:
    build:
      context: .
      dockerfile: tools/corpus/Dockerfile
    environment:
      CORPUS_OUTPUT_DIR: /data/documents
      CORPUS_DOWNLOAD_DIR: /data/downloads
      CORPUS_MAX_DOCUMENTS: ${CORPUS_MAX_DOCUMENTS:-}
    volumes:
      - corpus-data:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/ParallelSearch.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Ollama__BaseUrl: http://ollama:11434
      Corpus__DirectoryPath: /data/corpus/documents
      Corpus__MaxDocuments: ${CORPUS_MAX_INDEX_DOCUMENTS:-}
    volumes:
      - corpus-data:/data/corpus:ro
    depends_on:
      corpus-prepare:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-model-loader:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama-model-loader:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:0.5b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  corpus-data:
  ollama-data:
